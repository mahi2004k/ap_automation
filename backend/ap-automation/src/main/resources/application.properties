spring.application.name=ap-automation

# ==========================================================
# Database (PostgreSQL)
# Set these via environment variables before starting the app.
# See .env.example / README.md for setup instructions.
# ==========================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ap_automation_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================================
# Hibernate / JPA
# ==========================================================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# ==========================================================
# JWT
# jwt.secret MUST be overridden in production via the JWT_SECRET
# environment variable. The default below is for local dev only.
# ==========================================================
jwt.secret=${JWT_SECRET:ZmY2YjZkNWQyZjFhOGU5YzdiNWEzZDFmNmU4YzliN2EyZDRmNmU4YzlhMWIzZDVm}
jwt.expiration=${JWT_EXPIRATION:900000}
jwt.refresh-expiration=${JWT_REFRESH:604800000}

# ==========================================================
# Mail (optional — only required for approval/rejection/payment
# email notifications; the app runs fine without it)
# ==========================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==========================================================
# File upload limits (needed for invoice PDF uploads)
# ==========================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Server port
server.port=${SERVER_PORT:8080}
